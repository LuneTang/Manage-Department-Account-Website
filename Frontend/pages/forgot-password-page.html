<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="icon" href="../img/logo.png" type="image/icon type">
  <link href='../Libraries/Boxicon-2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../Libraries/bootstrap-5.3.3-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
  <div class="wrapper-forgot">
    <span id="error-message-email"></span>
    <form action="">
      <h1 id="heading">Forgot Password</h1>
      <div class="input-box">
        <input id="email-input" type="email" placeholder="Email" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <div class="buttons">
        <a class="btn" href="./login-page.html">Back</a>
        <button id="reset-button" type="submit" class="btn">Send Link</button>
      </div>
    </form>
  </div>
  <div class="spinner" id="loading-spinner"></div>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
