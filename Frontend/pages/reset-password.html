<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" href="../img/logo.png" type="image/icon type">
    <link href='../Libraries/Boxicon-2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../Libraries/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
    <div class="wrapper-reset">
        <span id="error-message"></span>
        <form id="reset-password-form">
            <h1 id="heading">Reset Password</h1>
            <div class="input-box">
                <input id="new-password" type="password" placeholder="New Password" required>
                <i class='bx bxs-lock-alt'></i>
                <i class='bx bxs-lock-open-alt' style="display:none;"></i>
            </div>
            <div class="input-box">
                <input id="confirm-password" type="password" placeholder="Confirm Password" required>
                <i class='bx bxs-lock-alt'></i>
                <i class='bx bxs-lock-open-alt' style="display:none;"></i>
            </div>
            <button id="reset-button" type="submit" class="btn">Reset Password</button>
        </form>
    </div>
    <div class="spinner" id="loading-spinner"></div>
    <script src="../js/reset-password.js"></script>
</body>
</html>
