<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="icon" href="../img/logo.png" type="image/icon type">
    <link href='../Libraries/Boxicon-2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="wrapper-register">
        <h1 id="heading">Register</h1>
        <div style="text-align: center; margin: 0 0 20px 0; font-size: 16px; letter-spacing: 1.5px;" class="error-message" id="error">sdfsdf</div>
        <form id="registration-form">
            <div class="form-group">
                <div class="input-box">
                    <input id="first-name" type="text" placeholder="First Name" required>
                    <span class="error-message" id="error-first-name"></span>
                </div>
                <div class="input-box">
                    <input id="last-name" type="text" placeholder="Last Name" required>
                    <span class="error-message" id="error-last-name"></span>
                </div>
            </div>
            <div class="form-group">
                <div class="input-box">
                    <input id="email" type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                    <span class="error-message" id="error-email"></span>
                </div>
                <div class="input-box">
                    <input id="username" type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                    <span class="error-message" id="error-username"></span>
                </div>
            </div>
            <div class="form-group">
                <div class="input-box">
                    <input id="password" type="password" placeholder="Password" required>
                    <i id="lock" class='bx bxs-lock-alt'></i>
                    <i id="unlock" class='bx bxs-lock-open-alt' style="display:none;"></i>
                    <span class="error-message" id="error-password"></span>
                </div>
                <div class="input-box">
                    <input id="confirm-password" type="password" placeholder="Confirm Password" required>
                    <i id="lock" class='bx bxs-lock-alt'></i>
                    <i id="unlock" class='bx bxs-lock-open-alt' style="display:none;"></i>
                    <span class="error-message" id="error-confirm-password"></span>
                </div>
            </div>
            <div class="buttons">
                <button id="register-button" type="submit" class="btn">Register</button>
                <a class="btn" href="./login-page.html">Back</a>
            </div>
        </form>
    </div>
    <div class="spinner" id="loading-spinner"></div>
  <script src="../js/signup.js"></script>
</body>
</html>
