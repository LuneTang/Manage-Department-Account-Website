<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Department Page</title>
    <link rel="icon" href="../img/logo.png" type="image/icon type">
    <link rel="stylesheet" href="../Libraries/FontAwesome-6.6.0/css/all.min.css">
    <link href="../Libraries/Boxicon-2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link href="../Libraries/bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button class="toggle-btn" type="button">
                    <i id="toggle-icon" class='bx bxs-category-alt' style='color:#ffffff'></i>
                </button>
                <div class="sidebar-logo">
                    <a href="../pages/home-page.html">VTI Academy</a>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="../pages/profile.html" class="sidebar-link">
                        <i class='bx bx-user-circle' style='color:#ffffff'></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="../pages/department-page.html" class="sidebar-link" id="load-department">
                        <i class='bx bxs-briefcase'></i>
                        <span>Department</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="../pages/account-page.html" class="sidebar-link" id="load-account">
                        <i class='bx bxs-user-account'></i>
                        <span>Account</span>
                    </a>
                </li>
            </ul>
            <div id="logout-button" class="sidebar-footer" style="height: 4rem;">
                <a class="sidebar-link">
                    <i class='bx bx-log-out' style='color:#ffffff'></i>
                    <span id="logout">Logout</span>
                </a>
            </div>
        </aside>
        <div class="main">
            <span id="message"></span>
            <h3 id="section">Department</h3>
            <div id="funcs" class="overall-funtions">
                <button id="add-department" type="button" class="btn btn-success">Create New Department</button>
                <button id="delete-all-selected" type="button" class="btn btn-danger">Delete All Selected</button>
            </div>
            <div id="main-content" class="main-content">
                <div class="filters mb-3">
                    <!-- Search -->
                  <input type="text" id="search-input" class="form-control mb-2" placeholder="Search...">
                  <div class="d-flex align-items-center mb-2">
                     <!-- Dropdown filter -->
                    <select id="filter-type" class="form-select me-3">
                        <option value="None">Select type</option>
                       
                    </select>
                    <div class="filter-range">
                      <label for="min-value" class="form-label">From date:</label>
                      <input type="date" id="min-value" class="form-control me-2">
                      <label for="max-value" class="form-label">To date:</label>
                      <input type="date" id="max-value" class="form-control">
                    </div>
                  </div>
                </div>
            
                <table class="table table-striped department-table">
                    <thead>
                        <tr id="department-tr">
                          <th><input type="checkbox" id="select-all"></th>
                          <th>Name</th>
                          <th>Type</th>
                          <th>Code</th>
                          <th>Members <i class="fas fa-up-long sort-icon" id="asc"></i><i class="fas fa-down-long sort-icon" id="desc"></i></th>
                          <th>Created date</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      
                  <tbody id="table-body">
                    <!-- Rows will be dynamically generated -->
                  </tbody>
                </table>
            
                <div class="pagination d-flex justify-content-between">
                  <button class="btn btn-primary" id="prev-btn">Prev</button>
                  <span id="page-info">1 / 2</span>
                  <button class="btn btn-primary" id="next-btn">Next</button>
                </div>
            </div>
            <div class="forms">
    
                <!-- Create form -->
                <div class="wrapper-cre-dep-form">

                    <div class="close-cre-dep"><i id="close-cre-dep" class="fas fa-x"></i></div>
                    <div class="form-cre-dep">
                        <div class="input-box-form-dep">
                            <input id="in-cre-dep-name" type="text" placeholder="Input New Name..." required>
                            <span id="form-cre-dep-message"></span>
                       
                            <select id="type-cre-dep-form" class="form-select me-3">
                                <option value="None">Select type</option>
                               
                            </select>
                        </div>
                        <span id="title-acc-cre-dep">Add account (at least 1)</span>
                        <table class="table table-striped cre-form-table">
                            <thead>
                                <tr>
                                  <th><input type="checkbox" id="select-acc-cre-dep"></th>
                                  <th>Full Name</th>
                                  <th>Username</th>
                                  <th>Role</th>
                                  <th>Created date</th>
                                </tr>
                              </thead>
                              
                          <tbody id="table-body-cre-dep">
                            <!-- Rows will be dynamically generated -->
                             
                          </tbody>
                        </table>
                    
                        <div class="pagination d-flex justify-content-between">
                          <button class="btn btn-primary" id="prev-cre-dep-btn">Prev</button>
                          <span id="paging-cre-dep-account-form">1 / 2</span>
                          <button class="btn btn-primary" id="next-cre-dep-btn">Next</button>
                        </div>
            
                        <div class="done-button"><button id="done-cre-dep" type="button" class="btn btn-light">Save</button></div>
                    </div>
                </div>

                <!-- Edit form -->
                <div class="wrapper-edt-dep-form">

                    <div class="close-edt-dep"><i id="close-edt-dep" class="fas fa-x"></i></div>
                    <div class="form-edt-dep">
                        <div class="input-box-form-dep">
                            <input id="in-edt-dep-name" type="text" placeholder="Input New Name..." required>
                            <span id="form-edt-dep-message"></span>
                       
                            <select id="type-edt-dep-form" class="form-select me-3">
                                <option value="None">Select type</option>
                               
                            </select>
                        </div>
                        <div>
                            <span id="title-acc-edt-dep">Adding more account</span>
                        </div>
                        <table class="table table-striped edt-form-table">
                            <thead>
                                <tr>
                                  <th><input type="checkbox" id="select-acc-edt-dep"></th>
                                  <th>Full Name</th>
                                  <th>Username</th>
                                  <th>Role</th>
                                  <th>Created date</th>
                                </tr>
                              </thead>
                              
                          <tbody id="table-body-edt-dep">
                            <!-- Rows will be dynamically generated -->
                             
                          </tbody>
                        </table>
                    
                        <div class="pagination d-flex justify-content-between">
                          <button class="btn btn-primary" id="prev-edt-dep-btn">Prev</button>
                          <span id="paging-edt-dep-account-form">1 / 2</span>
                          <button class="btn btn-primary" id="next-edt-dep-btn">Next</button>
                        </div>
            
                        <div class="done-button"><button id="done-edt-dep" type="button" class="btn btn-light">Save</button></div>
                    </div>
                </div>

                <!-- Delete form -->
                <div class="wrapper-del-dep-form">
                    <div class="form-del-dep">
                        <div>
                            <div id="title-del-dep"></div>
                        </div>
                        <div class="buttons">
                            <button id="cancel" type="button" class="btn btn-outline-secondary">Cancel</button>
                            <button id="del-all-dep" type="button" class="btn btn-outline-danger">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner" id="loading-spinner"></div>
    <script src="../Libraries/JQuery/jquery-3.7.1.min.js"></script>
    <script src="../js/urlAccDep.js"></script>
    <script src="../js/overall.js"></script>
    <script src="../js/department-page.js"></script>
    
      
</body>

</html>
