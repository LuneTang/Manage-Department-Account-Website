<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Login</title>
  <link rel="icon" href="../img/logo.png" type="image/icon type">
  <link href='../Libraries/Boxicon-2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="wrapper-login">
    <span id="error-message-username"></span>
    <span id="error-message-password"></span>
    <form action="">
      <h1 id="heading">Login</h1>
      <div class="input-box">
        <input id="username-login" type="text" placeholder="Username" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input id="password-login" type="password" placeholder="Password" required>
        <i id="lock" class='bx bxs-lock-alt'></i>
        <i id="unlock" class='bx bxs-lock-open-alt' style="display:none;"></i>
      </div>
      <div class="remember-forgot">
        <label><input id="remember-me" type="checkbox">Remember Me</label>
        <a href="./forgot-password-page.html">Forgot Password</a>
      </div>
      <button id="login-button" type="submit" class="btn">Login</button>
      <div class="register-link">
        <p>Don't have an account? <a href="./sign-up.html">Register</a></p>
      </div>
    </form>
  </div>
  <div class="spinner" id="loading-spinner"></div>
  <script src="../js/login.js"></script>
</body>
</html>
